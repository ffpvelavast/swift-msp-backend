rollback:internal:
  stage: deploy
  image: alpine:latest
  environment:
    name: internal
    url: https://internal.rex.tax
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY_INT" | base64 -d > /tmp/deploy_key && chmod 400 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - mkdir -p ~/.ssh
    - ssh-keyscan "$INT_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - ssh root@"$INT_SERVER_IP" "test -f /var/www/rex/backend/target/rex-backend-prev.jar || (echo 'No previous JAR found'; exit 1)"
    - ssh root@"$INT_SERVER_IP" "cp /var/www/rex/backend/target/rex-backend-prev.jar /var/www/rex/backend/target/rex-backend.jar && systemctl restart test-rex"
    - echo "Rolled back — verifying..."
    - |
      for i in $(seq 1 12); do
        sleep 10
        if ssh root@"$INT_SERVER_IP" "curl -sf http://localhost:8090/actuator/health | grep -q UP"; then
          echo "Rollback successful"; exit 0
        fi
        echo "Waiting... ($((i*10))s)"
      done
      echo "Rollback health check failed"; exit 1
  only:
    - dev
  when: manual
  needs: []
