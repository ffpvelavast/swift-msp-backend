spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5600/app}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: filesystem:rex-backend-flyway/rex-backend-flyway/migrations
    validate-on-migrate: false
    baseline-on-migrate: false
